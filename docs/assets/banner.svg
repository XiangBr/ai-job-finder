<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.6" stop-color="#312e81"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- marca -->
  <g transform="translate(80 92) scale(1.5)">
    <rect width="64" height="64" rx="15" fill="url(#mark)"/>
    <circle cx="27" cy="27" r="14" fill="none" stroke="#fff" stroke-width="5"/>
    <path d="M37.5 37.5 L49 49" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
    <rect x="19.6" y="20" width="3.8" height="13" rx="1.2" fill="#fff"/>
    <rect x="25.1" y="20" width="3.8" height="9.5" rx="1.2" fill="#c7d2fe"/>
    <rect x="30.6" y="20" width="3.8" height="6" rx="1.2" fill="#c7d2fe"/>
    <path d="M50 6 Q50.8 13.2 58 14 Q50.8 14.8 50 22 Q49.2 14.8 42 14 Q49.2 13.2 50 6 Z" fill="#fde68a"/>
  </g>

  <!-- título -->
  <text x="80" y="275" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" fill="#ffffff" letter-spacing="1">AI-JOB-FINDER</text>
  <text x="82" y="333" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="29" fill="#c7d2fe">Encontra vagas, analisa o fit com IA</text>
  <text x="82" y="372" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="29" fill="#c7d2fe">e adapta o seu CV para cada uma.</text>
  <text x="82" y="420" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#a5b4fc" font-style="italic">A candidatura continua sendo sua.</text>

