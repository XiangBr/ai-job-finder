        <text x="18" y="58" font-size="15" fill="#64748b">Indústria · Híbrido</text>
        <rect x="18" y="70" width="84" height="24" rx="12" fill="#ffedd5"/>
        <text x="60" y="87" font-size="13" font-weight="600" fill="#c2410c" text-anchor="middle">Morna · 72</text>
      </g>
      <g transform="translate(22 304)">
        <rect width="356" height="104" rx="14" fill="#ffffff"/>
        <text x="18" y="34" font-size="18" font-weight="600" fill="#0f172a">Analista de Dados</text>
        <text x="18" y="58" font-size="15" fill="#64748b">Energia · Presencial</text>
        <rect x="18" y="70" width="76" height="24" rx="12" fill="#e0f2fe"/>
        <text x="56" y="87" font-size="13" font-weight="600" fill="#0369a1" text-anchor="middle">Fria · 58</text>
