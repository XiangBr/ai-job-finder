[project]
name = "automate-cv-backend"
version = "0.1.0"
description = "Busca vagas com JobSpy, analisa contra o perfil e gera CVs adaptados"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "apscheduler>=3.10,<4",
    "python-jobspy>=1.1.80",
    "pyyaml>=6.0",
    "pydantic-settings>=2.4",
    "bcrypt>=4.2",
    "itsdangerous>=2.2",
    "anthropic>=0.70",
    "mcp>=1.12",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pypdf>=5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
